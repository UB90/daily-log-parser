[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daily-log-parser"
version = "1.0.0"
description = "A file-driven CLI plan tracker. One JSON file."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "UB90" }]
keywords = ["cli", "planner", "habit-tracker", "learning-plan", "offline"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0",
]

[project.scripts]
daily-log = "daily_log_parser.cli:main"

[project.urls]
Homepage = "https://github.com/UB90/daily-log-parser"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_log_parser"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "plans",
    "README.md",
]
